<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coding ᯓ★</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        header {
            position: static !important;
            top: auto !important;
        }

        body {
            background-image: url('images/portfolio/coding/coding-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .content-container {
            background: transparent !important;
            box-shadow: none !important;
            margin-top: 0 auto 40px auto !important;
        }

        .translucent-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 15px;
            padding: 40px;
            max-width: 850px;
            margin: 10px auto 40px auto !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            font-family: 'Times New Roman', serif;
            color: #111;
            position: relative;
        }

        .card-header-title {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .pub-table-container {
            position: relative;
            margin-bottom: 40px;
        }

        .pub-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
            background: #fff;
        }

        .pub-table th, .pub-table td {
            border: 1px solid #000;
            padding: 12px 15px;
            text-align: center;
            font-size: 0.95rem;
        }

        .pub-table th {
            background-color: #000;
            color: #fff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .guitar-sticker {
            position: absolute;
            right: -40px;
            top: 150px;
            width: 130px;
            z-index: 2;
            transform: rotate(15deg);
        }

        .section-block {
            margin-bottom: 55px;
            position: relative;
        }

        .section-block h3 {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .two-column {
            display: flex;
            gap: 30px;
        }

        .two-column p {
            flex: 1;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .single-column p {
            line-height: 1.6;
            font-size: 0.95rem;
            max-width: 100%;
            text-align: justify;
        }

        .small-stars-sticker {
            position: absolute;
            right: 400px;
            top: 500px;
            width: 300px;
            z-index: 2;
        }

        .dotted-stars-sticker {
            position: absolute;
            right: -20px;
            top: 380px;
            width: 300px;
            z-index: 2;
            transform: rotate(10deg);
            opacity: 0.6;
        }

        .hearts-sticker {
            position: absolute;
            left: 0;
            bottom: -35px;
            width: 100px;
            z-index: 2;
        }

        .guitar-sticker, 
        .small-stars-sticker, 
        .dotted-stars-sticker, 
        .floating-icon {
            pointer-events: none;
        }

        .decor-row {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            margin-top: 40px;
            gap: 25px;
        }

        .cassette-img {
            width: 160px;
            object-fit: contain;
        }

        .image-stack {
            position: relative;
            display: inline-block;
        }

        .character-img {
            max-height: 160px;
            object-fit: contain;
            display: block;
        }

        .floating-icon {
            position: absolute;
            top: -70px;
            right: -15px;
            width: 120px;
            z-index: 3;
            object-fit: contain;
        }

        body, *, a, button, .nav-link, .dropbtn {
            cursor: url('images/portfolio/coding/crona-cursor.png'), auto !important;
        }

        .floating-music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            z-index: 9999;
            display: none;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            color: #fff;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-family: sans-serif;
        }

        .player-close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .song-player-bar {
                width: 100%;
                max-width: 400px;
                margin: 5px auto 10px auto;
                padding: 0;
        }

        .section-block a {
            text-decoration: none;
            color: #4A3B52;
            transition: color 0.3s ease;
        }

        .column-content {
            flex: 1;
            line-height: 1.6;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
        }

        .continue-btn {
            display: inline-block;
            background-color: #000;
            color: white !important;
            padding: 8px 18px;
            margin-top: -20px;
            margin-bottom: 50px;
            text-decoration: none;
            font-family: 'Times New Roman', serif;
            font-size: 0.95rem;
            border: 2px solid #000;
            border-radius: 4px;
            text-align: center;
            align-self: flex-start;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            background-color: #fff;
            color: #000 !important;
        }
    </style>
</head>
<body>
    <header>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">About Me!</a>
            <span class="divider">|</span>
            <div class="dropdown">
                <span class="nav-link dropbtn">Portfolios ✰</span>
                <div class="dropdown-content">
                    <a href="poetry.html">poetry | written works</a>
                    <a href="visual-arts.html">visual arts</a>
                    <a href="coding.html">coding</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="content-container">
        <div class="translucent-card">
            <div class="card-header-title">
                    <b>coding ⋆｡°✩</b>
            </div>

            <div class="section-block single-column">
                <h1 style="text-align:center;">Under construction</h1>
                <p style="text-align:center;">
                    Come back later!
                </p>
            </div>
            <div style="text-align:center; font-size: 1.2rem; margin: 30px 0;">✮ ⋆ ˚｡𖦹 ⋆｡°✩</div>
        </div>
    </main>

</body>
</html>
