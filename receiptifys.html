    <script>
        const monthFilter = document.getElementById('month-filter');
        const yearFilter = document.getElementById('year-filter');
        const sortOrder = document.getElementById('sort-order');
        
        const grid = document.querySelector('.receipt-grid');
        const receiptsArray = Array.from(document.querySelectorAll('.receipt-item'));

        function updateGrid() {
            const selectedMonth = monthFilter.value;
            const selectedYear = yearFilter.value;
            const order = sortOrder.value;

            receiptsArray.sort((a, b) => {
                const yearA = a.getAttribute('data-year');
                const yearB = b.getAttribute('data-year');
                
                const monthA = a.getAttribute('data-month').padStart(2, '0');
                const monthB = b.getAttribute('data-month').padStart(2, '0');
                
                const dateA = parseInt(yearA + monthA);
                const dateB = parseInt(yearB + monthB);

                if (order === 'desc') {
                    return dateB - dateA;
                } else {
                    return dateA - dateB;
                }
            });

            receiptsArray.forEach(receipt => {
                const itemMonth = receipt.getAttribute('data-month');
                const itemYear = receipt.getAttribute('data-year');
                
                const matchesMonth = (selectedMonth === 'all') || (itemMonth === selectedMonth);
                const matchesYear = (selectedYear === 'all') || (itemYear === selectedYear);

                if (matchesMonth && matchesYear) {
                    receipt.style.display = 'block';
                } else {
                    receipt.style.display = 'none';
                }

                grid.appendChild(receipt);
            });
        }

        monthFilter.addEventListener('change', updateGrid);
        yearFilter.addEventListener('change', updateGrid);
        sortOrder.addEventListener('change', updateGrid);

        updateGrid();
    </script>
